<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=overlays-content">
<meta name="theme-color" content="#0d0d0d">
<script>document.documentElement.dataset.theme=localStorage.getItem('parking-theme')||'dark'</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Παρκινγκ">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Παρκινγκ</title>
<style>
  :root{
    --bg:#f1f5f9; --card:#fff; --text:#0f172a; --muted:#64748b; --line:#e2e8f0;
    --accent:#2563eb; --accent-d:#1d4ed8; --ok:#16a34a; --warn:#d97706; --danger:#dc2626;
    --bt-bg:#dbeafe; --bt-fg:#1d4ed8; --bt-bd:#93c5fd; --rd-bg:#fee2e2; --rd-fg:#b91c1c; --rd-bd:#fca5a5;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:90px}
  header{position:sticky;top:0;z-index:10;background:#0f172a;color:#fff;padding:12px 14px calc(12px);box-shadow:0 2px 8px rgba(0,0,0,.25)}
  .top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
  h1{font-size:18px;margin:0}
  .badge{font-size:12px;padding:3px 8px;border-radius:99px;background:#334155}
  .badge.live{background:#166534}
  .badge.demo{background:#92400e}
  #q{width:100%;font-size:22px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:12px 14px;border-radius:12px;border:2px solid transparent;outline:none;background:#fff;color:#0f172a}
  #q:focus{border-color:var(--accent)}
  .tabs{display:flex;gap:6px;margin:12px 14px 0}
  .tab{flex:1;padding:10px;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:10px;font-weight:600;font-size:15px}
  .tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
  main{padding:12px 14px;max-width:760px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:6px;transition:padding .2s,box-shadow .2s,border-color .2s}
  .card[data-id]{cursor:pointer;-webkit-tap-highlight-color:rgba(0,0,0,.06)}
  .card.open{padding:14px 14px 12px;border-color:var(--accent);box-shadow:0 4px 14px rgba(0,0,0,.12)}
  .row{display:flex;align-items:center;gap:10px}
  .plate{display:inline-block;flex:none;font-weight:800;font-size:17px;letter-spacing:1.5px;padding:1px 8px;border:2px solid var(--text);border-radius:6px;background:#fff;color:#0f172a;transition:font-size .2s}
  .card.open .plate{font-size:22px;letter-spacing:2px;padding:2px 10px}
  .loc{flex:1;min-width:0;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:font-size .2s}
  .card.open .loc{font-size:18px}
  .chev{flex:none;color:var(--muted);font-size:13px;transition:transform .2s}
  .card.open .chev{transform:rotate(180deg)}
  .more{display:grid;grid-template-rows:0fr;transition:grid-template-rows .22s ease}
  .card.open .more{grid-template-rows:1fr}
  .more>div{overflow:hidden;min-height:0}
  .meta{color:var(--muted);font-size:14px;display:flex;flex-wrap:wrap;gap:4px 14px;padding-top:10px}
  .meta a{color:var(--accent);text-decoration:none;font-weight:600}
  .tag{flex:none;font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px}
  .tag.in{background:#dcfce7;color:#166534}
  .tag.out{background:#e2e8f0;color:#475569}
  .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .btn.nav{background:#0ea5e9;border-color:#0ea5e9;color:#fff}
  button{font:inherit;cursor:pointer}
  .btn{padding:10px 14px;border-radius:10px;border:1px solid var(--bt-bd);background:var(--bt-bg);color:var(--bt-fg);font-weight:600}
  .btn:disabled{opacity:.45}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.go{background:var(--ok);border-color:var(--ok);color:#fff}
  .btn.danger{background:var(--rd-bg);border-color:var(--rd-bd);color:var(--rd-fg)}
  .grow{flex:1}
  .empty{text-align:center;color:var(--muted);padding:40px 10px}
  h3{margin:18px 2px 8px;font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:20;background:var(--accent);color:#fff;border:0;border-radius:99px;padding:16px 22px;font-size:17px;font-weight:700;box-shadow:0 6px 18px rgba(37,99,235,.45)}
  dialog{border:0;border-radius:16px;padding:0;width:min(520px,94vw);background:var(--card);color:var(--text)}
  dialog::backdrop{background:rgba(0,0,0,.55)}
  form{padding:18px}
  form h2{margin:0 0 12px;font-size:19px}
  label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px;font-weight:600}
  input,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-size:17px}
  input.pl{font-size:22px;font-weight:800;letter-spacing:2px;text-transform:uppercase}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chip{padding:8px 12px;border-radius:99px;border:1px solid var(--bt-bd);background:var(--bt-bg);color:var(--bt-fg);font-size:14px;font-weight:600}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .warn{background:#fef3c7;color:#92400e;border-radius:10px;padding:10px;font-size:14px;margin-top:10px}
  .srch{display:flex;gap:8px}
  .srch input{flex:1;min-width:0}
  .cam{flex:none;width:54px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-size:24px}
  .plrow{display:flex;gap:8px}
  .plrow input{flex:1;min-width:0}
  .plrow .cam{width:52px;border-radius:10px}
  html,body{touch-action:manipulation}                      /* χωρίς zoom με διπλό πάτημα */
  #scan{width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;margin:0;border-radius:0}
  #scan[open]{display:flex;flex-direction:column}
  #scan .scanwrap{flex:1;min-height:0;display:flex;flex-direction:column;padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
  #scan h2{margin:0 0 6px;font-size:17px;flex:none}
  #scan .vidarea{flex:1 1 0;min-height:60px;display:flex;align-items:center;justify-content:center;margin-bottom:6px;overflow:hidden}
  #scan #scanPrev{flex:none;display:block;height:34px;width:auto;max-width:60%;margin:0 auto 4px;border-radius:6px;background:#222}
  #scan .scanout{flex:none;min-height:0;max-height:20dvh;overflow:auto;margin-bottom:6px;font-size:14px}
  #scan .actions{flex:none;margin-top:0}
  .vid{position:relative;background:#000;border-radius:12px;overflow:hidden;flex:none}
  .vid video{display:block;width:100%;height:100%}
  .guide{position:absolute;left:5%;width:90%;top:30%;height:40%;border:3px solid #22c55e;border-radius:10px;box-shadow:0 0 0 999px rgba(0,0,0,.45)}
  .scanout{min-height:48px;font-size:15px;color:var(--muted);margin-bottom:10px}
  .scanout b{color:var(--text);font-size:22px;letter-spacing:2px}
  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 16px;border-radius:10px;z-index:50;font-size:15px}

  /* ===== Ανανεωμένη εμφάνιση ===== */
  :root{--grad:linear-gradient(135deg,#0b1b3a 0%,#123a7a 100%);--r:14px;--shadow:0 1px 2px rgba(15,23,42,.06),0 4px 14px rgba(15,23,42,.06)}
  body{background:var(--bg);-webkit-font-smoothing:antialiased}
  header{background:var(--grad);padding:calc(32px + env(safe-area-inset-top)) 14px 14px;border-radius:0 0 20px 20px;box-shadow:0 8px 24px rgba(2,8,23,.35)}
  .brand{display:flex;align-items:center;gap:11px}
  .brand svg{width:38px;height:38px;border-radius:10px;box-shadow:0 3px 10px rgba(0,0,0,.4)}
  h1{font-size:20px;font-weight:800;letter-spacing:.2px;line-height:1.1}
  h1 small{display:block;margin-top:3px;font-size:11px;font-weight:600;color:#9db7ec;letter-spacing:.7px;text-transform:uppercase}
  .badge{background:rgba(255,255,255,.14);color:#e6eeff;backdrop-filter:blur(4px);font-weight:600}
  .badge.live{background:rgba(34,197,94,.25);color:#bbf7d0}
  .badge.demo{background:rgba(245,158,11,.28);color:#fde68a}
  #q{border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.25);border:2px solid transparent;background:#fff}
  .cam{background:linear-gradient(135deg,#2563eb,#3b82f6);box-shadow:0 3px 10px rgba(37,99,235,.55);border-radius:14px}
  .tabs{margin:14px 14px 0;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:99px;box-shadow:var(--shadow);gap:2px}
  .tab{border:0;background:transparent;border-radius:99px;padding:9px 8px;font-weight:700;font-size:14px;color:var(--muted)}
  .tab.on{background:linear-gradient(135deg,#1d4ed8,#3b82f6);color:#fff;box-shadow:0 2px 8px rgba(37,99,235,.45)}
  .card{border-radius:var(--r)}
  .plate{position:relative;padding-left:27px;border-radius:7px;border-width:2px;overflow:hidden;background:linear-gradient(#fff,#f1f5f9);box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .plate::before{content:attr(data-c);position:absolute;left:0;top:0;bottom:0;width:19px;background:#1d4ed8;color:#fff;font-size:8px;font-weight:800;letter-spacing:0;display:flex;align-items:flex-end;justify-content:center;padding-bottom:2px}
  .card.open .plate{padding-left:30px}
  .card.open .plate::before{width:21px;font-size:9px}
  .tag.in{background:rgba(22,163,74,.14);color:#15803d}
  .tag.out{background:rgba(100,116,139,.16);color:#475569}
  .btn{border-radius:12px}
  .btn.primary,.fab{background:linear-gradient(135deg,#1d4ed8,#3b82f6)}
  .fab{box-shadow:0 8px 24px rgba(37,99,235,.5);border-radius:99px}
  .btn.go{background:linear-gradient(135deg,#15803d,#22c55e);border-color:transparent}
  h3{font-size:12px;font-weight:800;letter-spacing:.8px}
  dialog{border-radius:20px;box-shadow:0 24px 60px rgba(2,8,23,.45)}
  .cols{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 2px}
  .cdot{width:32px;height:32px;border-radius:50%;border:2px solid rgba(100,116,139,.45);background:var(--c);padding:0;cursor:pointer;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
  .cdot.on{outline:3px solid var(--accent);outline-offset:2px}
  .cdot.sug{outline:2px dashed var(--accent);outline-offset:2px}
  .bchips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
  .bchips .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .cdot.sm{width:14px;height:14px;flex:none;cursor:default;border-width:1.5px;box-shadow:none}
  #chDlg .chb{padding:20px 18px 16px;display:flex;flex-direction:column;gap:10px;text-align:center}
  #chDlg .chp .plate{font-size:26px}
  #chDlg .chs{color:var(--muted);font-size:15px;margin-bottom:4px}
  #chDlg .chbtn{padding:15px;font-size:18px;font-weight:700}
  #chDlg .chbtn small{display:block;font-size:12px;font-weight:500;opacity:.85;margin-top:2px}
  #chDlg .chbtn:disabled{opacity:.45}
  #chDlg .chx{background:transparent;border:0;color:var(--muted)}
  .toast{background:#222;border-radius:99px;box-shadow:0 8px 24px rgba(0,0,0,.35);padding:11px 18px}

  /* ===== Θέματα: σκούρο (προεπιλογή) και φωτεινό — μινιμαλ ===== */
  :root,html[data-theme=light]{ --bg:#f2f2f2; --card:#fff; --text:#111; --muted:#6b6b6b; --line:#e0e0e0; --accent:#222; --accent-d:#000;
    --surf:#fff; --field:#ebebeb; --field-f:#fff; --seg:#e6e6e6; --seg-on:#fff; --seg-fg:#111; --badge:#ebebeb; --badge-fg:#555; --edge:#cfcfcf;
    --in-bg:#e4e4e4; --in-fg:#111; --out-bg:#ebebeb; --out-fg:#6b6b6b; --strip:#111; --chip:#fff; --inp:#f6f6f6;
    --bt-bg:#e8e8e8; --bt-fg:#222; --bt-bd:#cfcfcf; --rd-bg:#efefef; --rd-fg:#333; --rd-bd:#cfcfcf;
    --shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.06); --open-shadow:0 6px 20px rgba(0,0,0,.14); color-scheme:light }
  html[data-theme=dark]{ --bg:#0d0d0d; --card:#171717; --text:#f2f2f2; --muted:#9a9a9a; --line:#2a2a2a; --accent:#6e6e6e; --accent-d:#5a5a5a;
    --surf:#0d0d0d; --field:#1c1c1c; --field-f:#232323; --seg:#151515; --seg-on:#2c2c2c; --seg-fg:#fff; --badge:#1c1c1c; --badge-fg:#b0b0b0; --edge:#363636;
    --in-bg:#262626; --in-fg:#f2f2f2; --out-bg:#1c1c1c; --out-fg:#9a9a9a; --strip:#000; --chip:#1c1c1c; --inp:#1c1c1c;
    --bt-bg:#232323; --bt-fg:#e0e0e0; --bt-bd:#3a3a3a; --rd-bg:#222; --rd-fg:#ddd; --rd-bd:#3a3a3a;
    --shadow:none; --open-shadow:0 8px 24px rgba(0,0,0,.5); color-scheme:dark }
  body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top);background:var(--strip);z-index:60}
  header{background:var(--surf);color:var(--text);border-radius:0;padding:calc(env(safe-area-inset-top) + 32px) 14px 12px;box-shadow:0 1px 0 var(--line)}
  h1{color:var(--text);font-size:19px}
  h1 small{color:var(--muted);font-weight:600}
  .brand img{width:38px;height:38px;border-radius:10px;display:block}
  .badge{background:var(--badge);color:var(--badge-fg);backdrop-filter:none}
  .badge.live{background:var(--in-bg);color:var(--in-fg)}
  .badge.demo{background:var(--bt-bg);color:var(--bt-fg)}
  .tabbar{position:sticky;top:var(--hh,150px);z-index:9;background:var(--bg);padding:12px 14px 8px}
  .tabbar .tabs{margin:0}
  html,body{overflow-x:clip;max-width:100%;overscroll-behavior-x:none}
  .loc .lp{display:none}
  .card.open .loc .lb{display:none}
  .card.open .loc .lp{display:inline}
  .loc .lb{color:var(--muted);font-weight:600}
  .sum{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
  .sum:empty{display:none}
  header .stat{padding:4px 4px 4px 12px;font-size:13px}
  header .stat b{padding:1px 8px;font-size:13px}
  .stat.tot{background:var(--bt-bg);border-color:var(--bt-bd);color:var(--bt-fg)}
  .stat{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 6px 6px 14px;font-size:14px;font-weight:600;color:var(--muted)}
  .stat.z{cursor:pointer;-webkit-tap-highlight-color:transparent}
  .stat.z.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .stat.z.on b{background:#fff;color:#111}
  .stat b{background:var(--accent);color:#fff;border-radius:99px;min-width:26px;text-align:center;padding:2px 8px;font-size:14px}
  .ic{width:18px;height:18px;vertical-align:-4px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;margin-right:6px}
  .cam .ic{margin:0;width:26px;height:26px;vertical-align:middle}
  .tab{white-space:nowrap}
  .badge{white-space:nowrap}
  h1 small{white-space:nowrap;font-size:10px;letter-spacing:.4px}
  #themeBtn{border:0;font:inherit;line-height:0;padding:6px 9px;cursor:pointer;display:inline-flex;align-items:center}
  .badge.err{background:#b91c1c;color:#fff}
  #dlg.park .pkh,#dlg.park #camF{display:none!important}
  #chDlg{position:fixed;top:auto;bottom:0;left:0;right:0;margin:0 auto;width:min(520px,100vw);max-width:100vw;border-radius:22px 22px 0 0;max-height:calc(100dvh - 12px);overflow-y:auto;overscroll-behavior:contain;box-shadow:0 -10px 40px rgba(0,0,0,.5);animation:sheetUp .3s cubic-bezier(.2,.85,.25,1);padding:0}
  #chDlg::backdrop{animation:fadeIn .25s ease}
  #chDlg .chb{padding:10px 18px calc(14px + env(safe-area-inset-bottom));gap:8px;text-align:left}
  #chDlg .chb::before{content:"";display:block;width:40px;height:4px;border-radius:4px;background:var(--edge);margin:0 auto 6px}
  #chDlg .chp{display:flex;align-items:center;gap:12px}
  #chDlg .chp .plate{font-size:22px}
  #chDlg .chs{margin:0 0 4px;font-size:14px}
  #chDlg .chbtn{padding:11px 14px;font-size:16px;text-align:left;display:flex;align-items:baseline;gap:8px}
  #chDlg .chbtn small{display:inline;margin:0;font-size:12.5px;opacity:.75}
  #chDlg .chx{padding:9px;text-align:center;border:1px solid var(--line);color:var(--text)}
  .lp.wait{opacity:.7;font-style:italic}
  .badge[hidden]{display:none}
  #userBtn{background:var(--badge);color:var(--badge-fg)}
  #q{background:var(--field);border:1.5px solid var(--line);box-shadow:none;color:var(--text);border-radius:14px}
  #q::placeholder{font-size:16px;font-weight:600;letter-spacing:.3px;text-transform:none}
  #q::placeholder{color:var(--muted)}
  #q:focus{background:var(--field-f);border-color:var(--accent);box-shadow:none}
  .cam{background:var(--accent);box-shadow:none}
  .tabs{background:var(--seg);border:0;box-shadow:none;padding:4px}
  .tab{color:var(--muted)}
  .tab.on{background:var(--seg-on);color:var(--seg-fg);box-shadow:none}
  .card{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
  .card.open{border-color:var(--accent);box-shadow:var(--open-shadow)}
  .plate{background:#f4f4f4;border-color:#111;color:#111;box-shadow:none}
  .plate::before{background:#1d4ed8;color:#fff}
  .btn.primary,.fab{background:var(--accent);border-color:var(--accent);color:#fff}
  .fab{box-shadow:0 6px 18px rgba(0,0,0,.35)}
  .btn.go{background:#16a34a;border-color:#16a34a;color:#fff}
  .btn.nav{background:#555;border-color:#555;color:#fff}
  .btn{padding:7px 12px;font-size:14px;border-radius:10px}
  .nophone{font-size:12px;opacity:.75;margin-right:6px;white-space:nowrap}
  .actions{gap:6px;margin-top:10px}
  .fab{padding:11px 18px;font-size:15px}
  #dlg .actions .btn{padding:9px 14px;font-size:15px}
  dialog{background:var(--card);color:var(--text);border-radius:18px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
  dialog::backdrop{background:rgba(0,0,0,.55)}
  input,textarea,select{background:var(--inp);color:var(--text);border-color:var(--line)}
  .cdot{border-color:var(--edge);box-shadow:none}
  .chip{background:var(--chip);border-color:var(--line);color:var(--text)}
  .bchips .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .tag.in{background:var(--in-bg);color:var(--in-fg)}
  .tag.out{background:var(--out-bg);color:var(--out-fg)}
  #dlg{position:fixed;top:auto;bottom:0;left:0;right:0;margin:0 auto;width:min(520px,100vw);max-width:100vw;border-radius:22px 22px 0 0;max-height:calc(100dvh - 12px);overflow-y:auto;overscroll-behavior:contain;box-shadow:0 -10px 40px rgba(0,0,0,.5);animation:sheetUp .3s cubic-bezier(.2,.85,.25,1)}
  html.lock body{position:fixed;left:0;right:0;width:100%;overflow:hidden}
  html.lock{overflow:hidden;overscroll-behavior:none}
  #dlg::backdrop{animation:fadeIn .25s ease}
  #dlg form::before{content:"";display:block;width:40px;height:4px;border-radius:4px;background:var(--edge);margin:-6px auto 12px}
  @keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  #dlg form{padding-bottom:var(--kb,0px)}
  #dlg .actions{position:sticky;bottom:0;background:var(--card);margin:12px -18px 0;padding:10px 18px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);z-index:2;flex-wrap:nowrap}
  .card.open>.row{flex-wrap:wrap;row-gap:6px}
  .card.open>.row .tag{display:none}
  .card.open .chev{margin-left:auto}
  .card.open .loc{flex:1 1 90px}
  input.pl{border:1.5px solid var(--line);background:var(--inp)}

</head>

<script type="module">
/* ============================================================
   Ρυθμίσεις: το firebase-config.js δημιουργείται από το setup.sh.
   Αν δεν υπάρχει, η εφαρμογή τρέχει σε DEMO (τοπικά, μόνο σε αυτή τη συσκευή).
   ============================================================ */
import { initMap } from './map.js?v=36';
import { loadAlpr, readPlates } from './alpr.js?v=1';
let CFG = null;
try { CFG = (await import('./firebase-config.js')).default; } catch (e) { CFG = null; }
const LIVE = !!(CFG && CFG.apiKey && !String(CFG.apiKey).startsWith('YOUR'));

/* ---------- Κανονικοποίηση πινακίδας ----------
   Ελληνικές πινακίδες: τα ελληνικά γράμματα που μοιάζουν με λατινικά
   μετατρέπονται σε λατινικά, ώστε «ΥΚΑ-1234», «yka 1234» και «ΥΚΑ1234» να είναι ίδια. */
const GR2LAT = {Α:'A',Β:'B',Ε:'E',Ζ:'Z',Η:'H',Ι:'I',Κ:'K',Μ:'M',Ν:'N',Ο:'O',Ρ:'P',Τ:'T',Υ:'Y',Χ:'X'};
export function plateKey(s){
  return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase()
    .replace(/[^A-ZΑ-Ω0-9]/g,'').split('').map(c=>GR2LAT[c]||c).join('');
}
window.__plateKey = plateKey;

/* ---------- Επίπεδο δεδομένων (Firebase ή τοπικό) ---------- */
// Ονόματα εγγράφων ανά χάρτη (το «main» κρατά τα παλιά ονόματα ώστε να μη χαθεί ο υπάρχων χάρτης)
const mapDocNames = id => id==='main' ? { img:'main', spots:'spots', shapes:'shapes' } : { img:id, spots:id+'_spots', shapes:id+'_shapes' };
let store, ME = null;      // ME: ο συνδεδεμένος υπάλληλος (μόνο σε live λειτουργία)
if (LIVE) {
  const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js');
  const fs = await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js');
  const app = initializeApp(CFG);
  const db = fs.initializeFirestore(app, { localCache: fs.persistentLocalCache({ tabManager: fs.persistentMultipleTabManager() }) });
  ({ requireLogin: window.__rl } = await import('./auth.js?v=9'));
  ME = await window.__rl(app, db, fs, CFG);           // δεν προχωράει η εφαρμογή αν δεν γίνει είσοδος
  const col = fs.collection(db, 'vehicles');
  store = {
    subscribe(cb){
      const q = fs.query(col, fs.orderBy('entryAt','desc'), fs.limit(1500));
      return fs.onSnapshot(q, snap => cb(snap.docs.map(d => ({ id:d.id, ...d.data(), entryAt:d.data().entryAt?.toMillis?.() ?? Date.now(), exitAt:d.data().exitAt?.toMillis?.() ?? null }))), err => window.__status?.('Σφάλμα σερβερ'));
    },
    async add(v){ await fs.addDoc(col, { ...v, entryAt: fs.serverTimestamp(), exitAt:null }); },
    async update(id,p){ await fs.updateDoc(fs.doc(db,'vehicles',id), p); },
    async exit(id){ await fs.updateDoc(fs.doc(db,'vehicles',id), { exitAt: fs.serverTimestamp(), exitBy: staff() }); },
    async remove(id){ await fs.deleteDoc(fs.doc(db,'vehicles',id)); },
    // Χάρτες: πολλοί χάρτες. Το «main» κρατά τα παλιά έγγραφα (maps/main, maps/spots, maps/shapes)
    // και οι υπόλοιποι maps/<id>, maps/<id>_spots, maps/<id>_shapes. Η λίστα είναι στο maps/index.
    subscribeMaps(cb){
      return fs.onSnapshot(fs.doc(db,'maps','index'), s => cb(s.exists() ? (s.data().list||[]) : [{ id:'main', name:'Χάρτης 1' }]));
    },
    async setMaps(list){ await fs.setDoc(fs.doc(db,'maps','index'), { list, updatedAt: Date.now() }); },
    subscribeMap(id, cb){
      const n = mapDocNames(id);
      let img = null, spots = null, shapes = null; const emit = () => cb({ img, spots, shapes });
      const u1 = fs.onSnapshot(fs.doc(db,'maps',n.img),    s => { img    = s.exists() ? s.data() : null; emit(); });
      const u2 = fs.onSnapshot(fs.doc(db,'maps',n.spots),  s => { spots  = s.exists() ? s.data() : null; emit(); });
      const u3 = fs.onSnapshot(fs.doc(db,'maps',n.shapes), s => { shapes = s.exists() ? s.data() : null; emit(); });
      return () => { u1(); u2(); u3(); };
    },
    subscribeShapes(id, cb){ return fs.onSnapshot(fs.doc(db,'maps',mapDocNames(id).shapes), s => cb(s.exists() ? (s.data().list||[]) : [])); },
    subscribeSpots(id, cb){ return fs.onSnapshot(fs.doc(db,'maps',mapDocNames(id).spots), s => cb(s.exists() ? (s.data().list||[]) : [])); },
    async saveImage(id,o){ await fs.setDoc(fs.doc(db,'maps',mapDocNames(id).img),    { ...o, updatedAt: Date.now() }); },
    async saveSpots(id,o){ await fs.setDoc(fs.doc(db,'maps',mapDocNames(id).spots),  { ...o, updatedAt: Date.now() }); },
    async saveShapes(id,o){ await fs.setDoc(fs.doc(db,'maps',mapDocNames(id).shapes), { ...o, updatedAt: Date.now() }); },
    async deleteMapData(id){ const n = mapDocNames(id); await Promise.all([n.img,n.spots,n.shapes].map(x => fs.deleteDoc(fs.doc(db,'maps',x)))); },
  };
} else {
  const K='parking-demo-v1'; const subs=new Set(); const mapSubs=new Set();
  const load=()=>{ try{return JSON.parse(localStorage.getItem(K))||[]}catch{return[]} };
  const save=a=>{ localStorage.setItem(K,JSON.stringify(a)); subs.forEach(f=>f(sorted())); };
  const sorted=()=>load().sort((a,b)=>b.entryAt-a.entryAt);
  store = {
    subscribe(cb){ subs.add(cb); cb(sorted()); window.addEventListener('storage',()=>cb(sorted())); return ()=>subs.delete(cb); },
    async add(v){ const a=load(); a.push({ ...v, id:crypto.randomUUID(), entryAt:Date.now(), exitAt:null }); save(a); },
    async update(id,p){ save(load().map(x=>x.id===id?{...x,...p}:x)); },
    async exit(id){ save(load().map(x=>x.id===id?{...x,exitAt:Date.now(),exitBy:staff()}:x)); },
    async remove(id){ save(load().filter(x=>x.id!==id)); },
    subscribeMaps(cb){
      const emit=()=>{ let l=null; try{l=JSON.parse(localStorage.getItem('parking-maps-index'))}catch{} cb(l || [{ id:'main', name:'Χάρτης 1' }]); };
      mapSubs.add(emit); emit(); return ()=>mapSubs.delete(emit);
    },
    async setMaps(list){ localStorage.setItem('parking-maps-index',JSON.stringify(list)); mapSubs.forEach(f=>f()); },
    subscribeMap(id, cb){
      const n = mapDocNames(id), rd = k => { try{return JSON.parse(localStorage.getItem('parking-map-'+k))}catch{return null} };
      const emit=()=>cb({ img:rd(n.img), spots:rd(n.spots), shapes:rd(n.shapes) });
      mapSubs.add(emit); emit(); return ()=>mapSubs.delete(emit);
    },
    subscribeShapes(id, cb){
      const n = mapDocNames(id);
      const emit=()=>{ let s=null; try{s=JSON.parse(localStorage.getItem('parking-map-'+n.shapes))}catch{} cb((s&&s.list)||[]); };
      mapSubs.add(emit); emit(); return ()=>mapSubs.delete(emit);
    },
    subscribeSpots(id, cb){
      const n = mapDocNames(id);
      const emit=()=>{ let s=null; try{s=JSON.parse(localStorage.getItem('parking-map-'+n.spots))}catch{} cb((s&&s.list)||[]); };
      mapSubs.add(emit); emit(); return ()=>mapSubs.delete(emit);
    },
    async saveImage(id,o){ localStorage.setItem('parking-map-'+mapDocNames(id).img,JSON.stringify(o)); mapSubs.forEach(f=>f()); },
    async saveSpots(id,o){ localStorage.setItem('parking-map-'+mapDocNames(id).spots,JSON.stringify(o)); mapSubs.forEach(f=>f()); },
    async saveShapes(id,o){ localStorage.setItem('parking-map-'+mapDocNames(id).shapes,JSON.stringify(o)); mapSubs.forEach(f=>f()); },
    async deleteMapData(id){ const n = mapDocNames(id); [n.img,n.spots,n.shapes].forEach(x=>localStorage.removeItem('parking-map-'+x)); mapSubs.forEach(f=>f()); },
  };
}

/* ---------- Κατάσταση ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let mapsList = [];
let zoneF = '', openId = null, lastK = '', all = [], tab = 'active', editing = null, mapApi = null, pickedMap = null;   // pickedMap: ο χάρτης απ' όπου επιλέχθηκε η θέση

const modeEl = $('#mode');
// Σε live λειτουργία δεν δείχνουμε τίποτα· εμφανίζεται μήνυμα μόνο αν υπάρξει πρόβλημα σύνδεσης/σερβερ
const setStatus = msg => { if (msg){ modeEl.textContent = msg; modeEl.className = 'badge err'; modeEl.hidden = false; } else if (LIVE){ modeEl.hidden = true; } };
if (LIVE){ modeEl.hidden = true; }
else { modeEl.textContent = 'demo'; modeEl.className = 'badge demo'; modeEl.title = 'Τοπική λειτουργία – τα δεδομένα δεν μοιράζονται'; }
window.__status = setStatus;
if (LIVE){
  window.addEventListener('offline', () => setStatus('Χωρίς σύνδεση'));
  window.addEventListener('online', () => setStatus(''));
}

const CAN = !ME || ME.head;   // false = υπάλληλος: μόνο προβολή
// Θέμα: σκούρο (προεπιλογή) ή φωτεινό
const ICON_SUN = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>';
const ICON_MOON = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7z"/></svg>';
const applyTheme = t => { document.documentElement.dataset.theme = t; $('#themeBtn').innerHTML = t === 'dark' ? ICON_SUN : ICON_MOON; document.querySelector('meta[name=theme-color]')?.setAttribute('content', t === 'dark' ? '#0d0d0d' : '#ffffff'); };
applyTheme(document.documentElement.dataset.theme || 'dark');
// Η κεφαλίδα και οι καρτέλες μένουν σταθερές πάνω όταν γίνεται scroll
const setHH = () => document.documentElement.style.setProperty('--hh', document.querySelector('header').offsetHeight + 'px');
setHH(); new ResizeObserver(setHH).observe(document.querySelector('header')); window.addEventListener('resize', setHH);
$('#themeBtn').onclick = () => { const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; try { localStorage.setItem('parking-theme', t); } catch {} applyTheme(t); };
document.body.classList.toggle('ro', !CAN);
const staff = () => ME ? ME.name : (localStorage.getItem('parking-staff') || '');
function ensureStaff(){
  if (ME) return;
  if (!staff()) { const n = prompt('Το όνομά σου (για το ιστορικό):'); if (n) localStorage.setItem('parking-staff', n.trim()); }
}

const fmtT = ms => new Date(ms).toLocaleString('el-GR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
function fmtDur(a,b){
  const m = Math.max(0, Math.round((b-a)/60000)); const h = Math.floor(m/60);
  return h>=24 ? `${Math.floor(h/24)}μ ${h%24}ω` : h>0 ? `${h}ω ${m%60}λ` : `${m}λ`;
}

/* ---------- Χρώματα οχημάτων ---------- */
const COLORS = [['Λευκό','#f8fafc'],['Μαύρο','#111827'],['Γκρι','#6b7280'],['Ασημί','#cbd5e1'],['Μπλε','#2563eb'],['Κόκκινο','#dc2626'],['Πράσινο','#16a34a'],['Κίτρινο','#facc15'],['Πορτοκαλί','#f97316'],['Καφέ','#92400e'],['Μπεζ','#d6c3a1'],['Μπορντό','#7f1d1d']];
const colHex = n => (COLORS.find(c => c[0]===n) || [])[1] || null;
let pickedColor = '', sugColor = '';
function renderCols(){
  $('#cols').innerHTML = COLORS.map(([n,h]) => `<button type="button" class="cdot${pickedColor===n?' on':''}${!pickedColor && sugColor===n?' sug':''}" data-col="${n}" style="--c:${h}" title="${n}${!pickedColor && sugColor===n?' (πρόταση κάμερας)':''}" aria-label="${n}"></button>`).join('');
}
const TOP_BRANDS = ['Toyota','Volkswagen','Opel','Fiat','Peugeot','Citroën','Renault','Nissan','Hyundai','Kia','Ford','Mercedes-Benz','BMW','Skoda'];
let brandOther = false;
function renderBrands(){
  const v = $('#fBrand').value.trim(), low = v.toLowerCase();
  const custom = v && !TOP_BRANDS.some(b => b.toLowerCase()===low);
  const other = brandOther || custom;
  $('#fBrand').style.display = other ? '' : 'none';
  $('#bchips').innerHTML = TOP_BRANDS.map(b => `<button type="button" class="chip${low===b.toLowerCase()?' on':''}" data-b="${b}">${b}</button>`).join('')
    + `<button type="button" class="chip${other?' on':''}" data-other="1">Άλλο…</button>`;
}
$('#bchips').addEventListener('click', e => {
  const o = e.target.closest('[data-other]');
  if (o){ if (brandOther || ($('#fBrand').value.trim() && !TOP_BRANDS.some(b=>b.toLowerCase()===$('#fBrand').value.trim().toLowerCase()))){ brandOther = false; $('#fBrand').value = ''; renderBrands(); } else { brandOther = true; renderBrands(); $('#fBrand').focus(); } return; }
  const b = e.target.closest('[data-b]'); if (!b) return;
  brandOther = false;
  $('#fBrand').value = $('#fBrand').value.trim().toLowerCase()===b.dataset.b.toLowerCase() ? '' : b.dataset.b; renderBrands();
});
// Συμπλήρωση από προηγούμενη επίσκεψη της ίδιας πινακίδας (μόνο σε κενά πεδία)
function prefillFromHistory(){
  if (editing) return;
  const k = plateKey($('#fPlate').value); if (!k || k.length < 5) return;
  const prev = all.filter(v => (v.plateKey||plateKey(v.plate)) === k).sort((a,b)=>(b.entryAt||0)-(a.entryAt||0))[0];
  if (!prev) return;
  let ch = false;
  if (prev.brand && !$('#fBrand').value.trim()){ $('#fBrand').value = prev.brand; ch = true; }
  if (prev.color && !pickedColor){ pickedColor = prev.color; ch = true; }
  if (CAN && prev.phone && !$('#fPhone').value.trim()){ $('#fPhone').value = prev.phone; ch = true; }
  if (ch){ renderBrands(); renderCols(); toast('Συμπληρώθηκαν στοιχεία από προηγούμενη επίσκεψη'); }
}
$('#cols').addEventListener('click', e => { const b = e.target.closest('[data-col]'); if (!b) return; pickedColor = pickedColor===b.dataset.col ? '' : b.dataset.col; renderCols(); });

/* ---------- Απόδοση ---------- */
function carCard(v){
  const inside = !v.exitAt;
  const phone = v.phone ? `<a href="tel:${esc(v.phone)}">📞 ${esc(v.phone)}</a>` : '';
  return `<div class="card${v.id===openId?' open':''}" data-id="${v.id}">
    <div class="row"><span class="plate" data-c="${ccOf(v)}">${esc(v.plate)}</span>${colHex(v.color)?`<span class="cdot sm" style="--c:${colHex(v.color)}" title="${esc(v.color)}"></span>`:''}<span class="loc"><span class="lb">${esc(v.brand||'')}</span><span class="lp${v.location?'':' wait'}">${v.location?'📍 '+esc(v.location):'⏳ Χωρίς θέση'}</span></span><span class="tag ${inside?'in':'out'}">${inside?'ΜΕΣΑ':'ΕΦΥΓΕ'}</span><span class="chev">▼</span></div>
    <div class="more"><div>
    <div class="meta">
      <span>⏱ ${fmtT(v.entryAt)}${inside?` · ${fmtDur(v.entryAt,Date.now())}`:` → ${fmtT(v.exitAt)} · ${fmtDur(v.entryAt,v.exitAt)}`}</span>

/* ---------- Σάρωση πινακίδας με κάμερα (OCR στον browser) ----------
   Tesseract.js φορτώνεται μόνο όταν χρειαστεί. Διαβάζει συνεχώς το πλαίσιο της
   κάμερας και δέχεται το αποτέλεσμα όταν βγει ίδιο 2 φορές στη σειρά. */
const LETTERS = 'ABEZHIKMNOPTXY';                       // τα 14 γράμματα των ελληνικών πινακίδων
const TO_LET = { '0':'O', '1':'I', '8':'B', '2':'Z', '7':'T' };
const TO_DIG = { O:'0', I:'1', B:'8', Z:'2', T:'7' };
export function parsePlate(text){
  const s = String(text||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  let best = null;
  for (let i=0; i+7<=s.length; i++){
    let out = '', fixes = 0, ok = true;
    for (let j=0; j<7 && ok; j++){
      let c = s[i+j];
      if (j<3){ if(!LETTERS.includes(c)){ if(TO_LET[c]){c=TO_LET[c];fixes++} else ok=false } }
      else    { if(!/\d/.test(c)){ if(TO_DIG[c]){c=TO_DIG[c];fixes++} else ok=false } }
      out += c;
    }
    if (ok && (!best || fixes < best.fixes)) best = { plate: out.slice(0,3)+out.slice(3), fixes };
  }
  return best ? best.plate : null;
}
window.__parsePlate = parsePlate;
const GR_RE = /^[ABEZHIKMNOPTYX]{3}\d{4}$/;
const COUNTRIES = ['GR','AL','BG','RO','MK','RS','TR','CY','DE','IT','FR','NL','BE','AT','CH','GB','PL','CZ','UA','GE'];
const BGL = 'ABEKMHOPCTYX';
export function inferCountry(plate){
  const p = String(plate||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if (GR_RE.test(p)) return 'GR';
  if (new RegExp('^['+BGL+']{2}\\d{4}['+BGL+']{2}$').test(p)) return 'BG';
  if (/^(B\d{2,3}|[A-Z]{2}\d{2,3})[A-Z]{3}$/.test(p) && /^(B|[A-Z]{2})\d{2,3}[A-Z]{3}$/.test(p) && p.length>=6 && p.length<=7) return 'RO';
  if (/^[A-Z]{3}\d{3}$/.test(p)) return 'CY';
  if (/^\d{2}[A-Z]{1,3}\d{2,4}$/.test(p)) return 'TR';
  return '';
}

// Ξένες πινακίδες: άγνωστη μορφή, οπότε δεχόμαστε 4-9 χαρακτήρες με τουλάχιστον ένα ψηφίο και ένα γράμμα.
// Η ασφάλεια έρχεται από την επιβεβαίωση (ίδιο αποτέλεσμα 2 φορές) και από τον έλεγχο του χρήστη.
export function parseForeign(text){
  const t = String(text||'').toUpperCase();
  const cands = [t, ...t.split(/\r?\n/)];
  for (const c of cands){
    const s = c.replace(/[^A-Z0-9]/g,'');
    if (s.length>=4 && s.length<=9 && /\d/.test(s) && /[A-Z]/.test(s)) return s;
  }
  return null;
}

// Αυτόματη επιλογή: αν το κείμενο μοιάζει με ελληνική πινακίδα (3 γράμματα + 4 ψηφία, μέχρι 8 χαρακτήρες
// συνολικά ώστε να μη «κόβεται» κομμάτι από μεγαλύτερη ξένη πινακίδα) διορθώνεται ως ελληνική, αλλιώς ως ξένη.
export function parseAuto(text){
  const s = String(text||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  const gr = s.length <= 8 ? parsePlate(text) : null;
  return gr || parseForeign(text);
}

const medianOf = a => { const s=[...a].sort((p,q)=>p-q); return s[s.length>>1]; };

    c.a>=20 && !(c.x<=1 || c.y<=1 || c.x+c.w>=W-1 || c.y+c.h>=H-1) &&

  if (best.length<3) return null;
  const hr = medianOf(best.map(d=>d.h)), cy = medianOf(best.map(d=>d.y+d.h/2));
  const keep = cands.filter(d => Math.abs(d.y+d.h/2-cy)<=0.35*hr && d.h>=0.55*hr && d.h<=1.35*hr);

  const x0=Math.max(0,Math.min(...keep.map(d=>d.x))-e), x1=Math.min(W,Math.max(...keep.map(d=>d.x+d.w))+e);
  const y0=Math.max(0,Math.min(...keep.map(d=>d.y))-e), y1=Math.min(H,Math.max(...keep.map(d=>d.y+d.h))+e);

function prep(src, sx, sy, sw, sh, isolateChars = true){
  const W = 900, H = Math.round(W * sh / sw);
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d', { willReadFrequently:true });

  for (let i=0;i<W*H;i++){ const v=(d[4*i]*.3+d[4*i+1]*.59+d[4*i+2]*.11)|0; g[i]=v; hist[v]++; }
  const pct = p => { let acc=0; const tg=W*H*p; for (let i=0;i<256;i++){ acc+=hist[i]; if (acc>=tg) return i; } return 255; };
  const lo = pct(.01), hi = pct(.99), k = 255/Math.max(1,hi-lo);

/* Πρόταση χρώματος οχήματος από το κάδρο: δείγματα γύρω/πάνω από την πινακίδα, ταξινόμηση στα χρώματα της φόρμας */
function nameColor(r,g,b){
  r/=255; g/=255; b/=255; const mx = Math.max(r,g,b), mn = Math.min(r,g,b), d = mx-mn, v = mx, sat = mx ? d/mx : 0;
  let h = 0; if (d){ h = mx===r ? ((g-b)/d)%6 : mx===g ? (b-r)/d+2 : (r-g)/d+4; h = (h*60+360)%360; }
  if (v < .2) return 'Μαύρο';
  if (sat < .13) return v > .8 ? 'Λευκό' : v > .55 ? 'Ασημί' : 'Γκρι';
  if (h < 15 || h >= 345) return v < .5 ? 'Μπορντό' : 'Κόκκινο';
  if (h < 45) return sat < .4 && v > .6 ? 'Μπεζ' : v < .55 ? 'Καφέ' : 'Πορτοκαλί';
  if (h < 70) return sat < .35 && v > .6 ? 'Μπεζ' : 'Κίτρινο';

}
function sampleColor(src, box){
  try {
    const [x1,y1,x2,y2] = box, bw = x2-x1, bh = y2-y1, W = src.videoWidth || src.width, H = src.videoHeight || src.height;
    const cv = document.createElement('canvas'); cv.width = cv.height = 12; const cx = cv.getContext('2d', { willReadFrequently:true });
    const patches = [[x1-bw*.9, y1-bw*.75], [x1+bw*.35, y1-bw*.85], [x2+bw*.15, y1-bw*.75], [x1-bw*.9, y1-bw*.1], [x2+bw*.15, y1-bw*.1]];
    const votes = {};
    for (const [px,py] of patches){
      const pw = bw*.75, ph = Math.max(bh*.7, bw*.25), sx = Math.max(0, Math.min(W-pw, px)), sy = Math.max(0, Math.min(H-ph, py));
      if (pw < 4 || ph < 4) continue;
      cx.drawImage(src, sx, sy, pw, ph, 0, 0, 12, 12);
      const dta = cx.getImageData(0,0,12,12).data, rs = [], gs = [], bs = [];
      for (let i = 0; i < dta.length; i += 4){ rs.push(dta[i]); gs.push(dta[i+1]); bs.push(dta[i+2]); }
      const med = a => a.sort((x,y)=>x-y)[a.length>>1], n = nameColor(med(rs), med(gs), med(bs));
      votes[n] = (votes[n]||0) + 1;
    }
    const top = Object.entries(votes).sort((a,b) => b[1]-a[1] || (a[0]==='Μαύρο') - (b[0]==='Μαύρο'))[0];
    return top && top[1] >= 2 ? top[0] : '';      // μόνο όταν συμφωνούν τουλάχιστον 2 δείγματα

}

// Κύρια αναγνώριση (AI): εντοπισμός πινακίδας + ανάγνωση. Δέχεται το ίδιο αποτέλεσμα 2 φορές.
async function aiScan(){
  scanning = true; const seen = {}; let n = 0, dark = false;
  const pv = $('#scanPrev'), pvx = pv.getContext('2d');
  out.textContent = 'Στόχευσε την πινακίδα μέσα στο πράσινο πλαίσιο.';
  while (scanning){
    const vw = vid.videoWidth, vh = vid.videoHeight;
    if (!vw){ await sleep(200); continue; }
    try {
      const br = brightness(); lowCount = br < 60 ? lowCount+1 : 0; dark = lowCount >= 2;
      if (dark && torchCap && !torchOn && !torchManual) await setTorch(true);
      const sx = vw*.02, sy = vh*.18, sw = vw*.96, sh = vh*.64;
      const t0 = performance.now();
      const res = await readPlates(vid, sx, sy, sw, sh);
      if (!scanning) break;
      n++;
      const best = res[0];
      if (best){
        const bw = best.box[2]-best.box[0], bh = best.box[3]-best.box[1];
        pv.width = 240; pv.height = Math.max(24, Math.round(240*bh/bw));
        pvx.drawImage(vid, best.box[0], best.box[1], bw, bh, 0, 0, pv.width, pv.height);
      } else { pv.width = 240; pv.height = 40; pvx.clearRect(0,0,240,40); }
      let shown = '';
      for (const r of res){
        const p = r.conf >= .6 ? parseAuto(r.text) : null;
        if (!shown) shown = p || r.text;
        if (p){
          seen[p] = (seen[p]||0) + 1;
          if (seen[p] >= 2 || (r.conf >= .97 && r.score >= .8 && seen[p] >= 1 && /^[A-Z]{3}\d{4}$/.test(p) && n >= 2)) return accept(p, sampleColor(vid, r.box));
        }
      }
      out.innerHTML = (shown ? `Διαβάζω: <b>${esc(shown)}</b> …` : 'Στόχευσε την πινακίδα μέσα στο πράσινο πλαίσιο.')
        + (dark && !torchOn ? `<div style="font-size:13px;margin-top:4px">🌙 Χαμηλός φωτισμός${torchCap ? '' : ' — φώτισε την πινακίδα (π.χ. με φακό άλλου κινητού)'}</div>` : '')
        + `<div style="font-size:12px;margin-top:4px">Ανάγνωση #${n} · ${Math.round(performance.now()-t0)} ms${best ? ` · βεβαιότητα ${Math.round(best.conf*100)}%` : ' · δεν βρέθηκε πινακίδα'}</div>`;
    } catch(err){
      out.textContent = 'Σφάλμα αναγνώρισης: ' + (err && err.message || err);
      stopScan(); return;
    }
    await sleep(60);
  }
}

async function openScan(cb){
  onScan = cb; out.textContent = 'Άνοιγμα κάμερας…'; scanDlg.showModal();

    stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ideal:'environment'}, width:{ideal:1920}, height:{ideal:1080} }, audio:false });

  }

  if (btn.dataset.act==='map') mapApi.open({ mode:'browse', focus: v.location, mapId: v.mapId });
  if (btn.dataset.act==='edit') openForm(v);
  if (btn.dataset.act==='park') parkOnMap(v);
  if (btn.dataset.act==='phone'){ const n = (prompt(`Τηλέφωνο πελάτη για το ${v.plate}:`) || '').trim(); if (n){ try { await store.update(v.id, { phone:n }); toast('Αποθηκεύτηκε το τηλέφωνο'); } catch(err){ toast('Σφάλμα: '+err.message); } } }
  if (btn.dataset.act==='again'){ ensureStaff(); openForm({...v, __again:true}); }
  if (btn.dataset.act==='del' && confirm(`Να διαγραφεί οριστικά το ${v.plate} από τη λίστα και το ιστορικό;`)) { try { await store.remove(v.id); toast('Το όχημα διαγράφηκε'); } catch(err){ toast('Σφάλμα διαγραφής: '+err.message); } }
  if (btn.dataset.act==='exit' && confirm(`Έφυγε το ${v.plate};`)) { await store.exit(v.id); toast('Καταγράφηκε έξοδος'); }
});
$('#q').addEventListener('input',render);
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  if (t.dataset.tab==='map') return mapApi.open({ mode:'browse' });
  tab=t.dataset.tab; zoneF=''; $('#q').value=''; render();
});
$('#mapF').onclick = ()=>mapApi.open({ mode:'pick', onPick: (label, mapId)=>{ $('#fLoc').value = label; pickedMap = mapId || null; } });

let tt; function toast(m){ document.querySelector('.toast')?.remove(); const d=document.createElement('div'); d.className='toast'; d.textContent=m; document.body.append(d); clearTimeout(tt); tt=setTimeout(()=>d.remove(),2200); }

store.subscribeMaps(l => { mapsList = l || []; render(); });
mapApi = initMap({
  store, plateKey, esc, fmtT, fmtDur, toast, canEdit: () => CAN,
  getCars: () => all,
  onChange: () => render(),                       // όταν αλλάζουν οι θέσεις, ενημέρωσε τα κουμπιά «Στον χάρτη»
  openNewCarAt: (label, mapId) => { ensureStaff(); openForm(null, ''); $('#fLoc').value = label; pickedMap = mapId || null; $('#fPlate').focus(); },
  exitCar: async id => { const v = all.find(x=>x.id===id); if (v && confirm(`Έφυγε το ${v.plate};`)){ await store.exit(id); toast('Καταγράφηκε έξοδος'); } },
});
// Προφόρτωση του κώδικα του live χάρτη όταν η εφαρμογή είναι ανενεργή, ώστε το άνοιγμα να είναι άμεσο
(window.requestIdleCallback || (f => setTimeout(f, 1500)))(() => mapApi?.warm?.(), { timeout: 4000 });
// Προφόρτωση της αναγνώρισης πινακίδας στο παρασκήνιο, ώστε η κάμερα να ανοίγει αμέσως (εκτός αν ο χρήστης έχει οικονομία δεδομένων)
setTimeout(() => { if (!navigator.connection?.saveData) loadAlpr().catch(() => {}); }, 6000);
store.subscribe(rows => { window.__status?.(''); all = rows.map(r=>({...r, plateKey: r.plateKey || plateKey(r.plate)})); render(); mapApi.refresh(); });
setInterval(render, 60000); // ανανέωση διάρκειας
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
