<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1C2223">
<title>Το αυτοκίνητό σας</title>
<link rel="icon" href="/icon-192.png">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#1C2223;color:#f2efe9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
main{width:100%;max-width:420px}
img{width:84px;height:84px;border-radius:20px;margin-bottom:18px}
h1{font-size:24px;margin:0 0 10px}
p{font-size:17px;line-height:1.45;margin:0 0 22px;color:#cfcac0}
button{width:100%;padding:20px 16px;border:0;border-radius:18px;background:#C9AE8A;color:#1C2223;font-size:20px;font-weight:800;font-family:inherit}
button:disabled{opacity:.45}
.ok{color:#86efac}
.sub{font-size:14px;color:#8d9591;margin-top:16px}
</style>
</head>
<body>
<main id="m"><img src="/icon-192.png" alt=""><p>Φόρτωση…</p></main>
<script type="module">
const m = document.getElementById('m');
const show = (h, p, btn) => { m.innerHTML = '<img src="/icon-192.png" alt=""><h1>' + h + '</h1><p>' + (p || '') + '</p>' + (btn || ''); };
const bad = () => show('Μη έγκυρος σύνδεσμος', 'Ο σύνδεσμος δεν ισχύει ή έχει λήξει. Ρωτήστε τον υπάλληλο του πάρκινγκ.');
const t = (location.pathname.match(/^\/r\/([A-Za-z0-9_-]{8,64})/) || [])[1] || new URLSearchParams(location.search).get('t');
if (!t || !/^[A-Za-z0-9_-]{8,64}$/.test(t)) bad();
else try {
  const FB = 'https://www.gstatic.com/firebasejs/10.14.1/';
  const [{ initializeApp }, fs, cfg] = await Promise.all([import(FB + 'firebase-app.js'), import(FB + 'firebase-firestore.js'), import("/firebase-config.js")]);
  const db = fs.getFirestore(initializeApp(cfg.default));
  const ref = fs.doc(db, 'links', t);
  let last = null, timer = null;
  const draw = () => {
    clearTimeout(timer);
    if (!last) return bad();
    const st = last.st || 'in', askMs = last.askAt && last.askAt.toMillis ? last.askAt.toMillis() : 0;
    if (st === 'out') return show('Ευχαριστούμε!', 'Το αυτοκίνητό σας έχει παραδοθεί. Καλή συνέχεια!');
    if (st === 'taken') return show('<span class="ok">Το φέρνουν!</span>', 'Ένας συνεργάτης μας φέρνει το αυτοκίνητό σας. Περιμένετε στην είσοδο.');
    if (st === 'asked'){
      const wait = askMs + 120000 - Date.now();
      show('Το αίτημα στάλθηκε', 'Ετοιμάζουμε το αυτοκίνητό σας. Δεν χρειάζεται να κάνετε κάτι άλλο.',
        '<button id="b" ' + (wait > 0 ? 'disabled' : '') + '>Ξαναστείλε το αίτημα</button><div class="sub">Αν δεν έρθει σε λίγα λεπτά, μπορείτε να το στείλετε ξανά.</div>');
      bind();
      if (wait > 0) timer = setTimeout(draw, Math.min(wait + 200, 120000));
      return;
    }
    show('Θέλετε το αυτοκίνητό σας;', 'Πατήστε το κουμπί και θα σας το φέρουμε.', '<button id="b">🚗 Φέρτε το αυτοκίνητό μου</button>');
    bind();
  };
  const bind = () => {
    const b = document.getElementById('b'); if (!b) return;
    b.onclick = async () => {
      b.disabled = true; b.textContent = 'Αποστολή…';
      try { await fs.updateDoc(ref, { askAt: fs.serverTimestamp() }); }
      catch (e) { show('Δεν στάλθηκε', 'Δοκιμάστε ξανά σε λίγο. Αν έχετε ήδη στείλει αίτημα πριν από λίγο, περιμένετε 2 λεπτά.', '<button id="b">Δοκιμάστε ξανά</button>'); bind(); }
    };
  };
  fs.onSnapshot(ref, s => { last = s.exists() ? s.data() : null; draw(); }, () => bad());
} catch (e) { show('Δεν φορτώθηκε', 'Ελέγξτε τη σύνδεσή σας και δοκιμάστε ξανά.'); }
</script>
</body>
</html>
