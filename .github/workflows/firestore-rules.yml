name: Deploy Firestore rules
on:
  workflow_dispatch:   # μόνο χειροκίνητα· οι κανόνες δημοσιεύονται από την κονσόλα Firebase (ο λογαριασμός υπηρεσίας δεν έχει δικαίωμα)
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy rules
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PARKING_GAVRIIL_2026 }}
        run: |
          echo "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          sed -i "s/ADMIN_EMAIL/leukianos@gmail.com/" firestore.rules
          npx --yes firebase-tools@latest deploy --only firestore:rules --project parking-gavriil-2026 --non-interactive
